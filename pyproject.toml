[project]
name = "agent-eval-harness"
version = "1.1.0"
description = "Harness local de avaliação de agentes com racional auditável."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiofiles>=24.1.0,<25",
  "aiosqlite>=0.21.0,<1",
  "fastapi>=0.116.0,<1",
  "httpx>=0.28.0,<1",
  "langchain-openai>=0.3.0,<2",
  "pydantic>=2.11.0,<3",
  "pydantic-settings>=2.10.0,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0,<2",
  "pytest>=8.4.0,<9",
  "pytest-asyncio>=1.1.0,<2",
  "ruff>=0.12.0,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: chamada real opt-in a um provider externo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
